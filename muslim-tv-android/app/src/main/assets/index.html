.info{line-height:1.8;color:var(--mu)}.info b{color:var(--tx);font-size:1.2em}
button,a{font:inherit;color:inherit;cursor:pointer}
.bar{display:flex;gap:8px;align-items:center}
.gear,.mini{background:var(--card);border:0;border-radius:24px;min-width:48px;height:48px;padding:0 14px}.gear{font-size:22px}
.next{margin:22px 0 14px;font-size:clamp(18px,3vw,26px)}.next b{color:var(--ac)}.next span{direction:ltr;display:inline-block}
#al{background:var(--ac);color:#201a00;border-radius:12px;padding:12px;margin:10px 0;font-weight:700;text-align:center}
.times{display:grid;grid-template-columns:repeat(6,1fr);gap:10px}

.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;margin-top:28px}

const DK=e=>[['أَعُوذُ بِاللَّهِ مِنَ الشَّيْطَانِ الرَّجِيمِ<br>'+AK,'مرة واحدة'],[SU,'ثلاث مرات'],
[(e?'أَمْسَيْنَا وَأَمْسَى':'أَصْبَحْنَا وَأَصْبَحَ')+' الْمُلْكُ لِلَّهِ وَالْحَمْدُ لِلَّهِ، لَا إِلَٰهَ إِلَّا اللَّهُ وَحْدَهُ لَا شَرِيكَ لَهُ، لَهُ الْمُلْكُ وَلَهُ الْحَمْدُ وَهُوَ عَلَىٰ كُلِّ شَيْءٍ قَدِيرٌ','مرة واحدة'],
['بِسْمِ اللَّهِ الَّذِي لَا يَضُرُّ مَعَ اسْمِهِ شَيْءٌ فِي الْأَرْضِ وَلَا فِي السَّمَاءِ وَهُوَ السَّمِيعُ الْعَلِيمُ','ثلاث مرات'],
['رَضِيتُ بِاللَّهِ رَبًّا، وَبِالْإِسْلَامِ دِينًا، وَبِمُحَمَّدٍ ﷺ نَبِيًّا','ثلاث مرات'],
['أَعُوذُ بِكَلِمَاتِ اللَّهِ التَّامَّاتِ مِنْ شَرِّ مَا خَلَقَ','ثلاث مرات'],
['سُبْحَانَ اللَّهِ وَبِحَمْدِهِ','مئة مرة'],['أَسْتَغْفِرُ اللَّهَ وَأَتُوبُ إِلَيْهِ','مئة مرة']];
const RQ=[['سورة الفاتحة',FA],['آية الكرسي',AK],['الإخلاص والمعوذتان',SU],['أَذْهِبِ الْبَأْسَ رَبَّ النَّاسِ، وَاشْفِ أَنْتَ الشَّافِي، لَا شِفَاءَ إِلَّا شِفَاؤُكَ، شِفَاءً لَا يُغَادِرُ سَقَمًا','مرة واحدة'],['أَعُوذُ بِكَلِمَاتِ اللَّهِ التَّامَّاتِ مِنْ شَرِّ مَا خَلَقَ','ثلاث مرات']].map(x=>x[0].length<30&&x[1].length>40?[x[1],x[0]]:x);
const K=[['أذكار الصباح',DK(0)],['أذكار المساء',DK(1)],['الرقية الشرعية',RQ]];
document.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>{const [t,it]=K[b.dataset.k],d=$('#rd');d.querySelector('h2').textContent=t;d.querySelector('.body').innerHTML=it.map(x=>`<p>${x[0]}</p><div class="c">${x[1]}</div>`).join('');d.showModal()});
const cy=$('#city');let g,gc;L.forEach((x,i)=>{if(x.c!=gc){g=document.createElement('optgroup');g.label=gc=x.c;cy.append(g)}g.append(new Option(x.n,i))});cy.append(new Option('موقع مخصص (إحداثيات)',-1));
$('#mt').append(new Option('تلقائي حسب البلد','auto'));for(const k in M)$('#mt').append(new Option(M[k][0],k));
function sync(){$('#city').value=S.ci;$('#mt').value=S.m;$('#as').value=S.asr;$('#aj').value=S.adj;$('#on').value=S.on;$('#la').value=S.lat;$('#lo').value=S.lon;$('#cu').hidden=S.ci>=0;$('#vo').value=S.vo;document.querySelectorAll('#pv select').forEach(s=>s.value=S.pv[+s.dataset.p]);save();tick()}
$('#gb').onclick=()=>{$('#st').showModal();chk()};
$('#city').onchange=e=>{S.ci=+e.target.value;sync()};
$('#mt').onchange=e=>{S.m=e.target.value;sync()};
$('#as').onchange=e=>{S.asr=+e.target.value;sync()};
$('#aj').onchange=e=>{S.adj=+e.target.value;sync()};
$('#on').onchange=e=>{S.on=+e.target.value;sync()};
$('#la').onchange=e=>{S.lat=+e.target.value;sync()};
$('#lo').onchange=e=>{S.lon=+e.target.value;sync()};
const VN=['محمد رفعت','عبد الباسط عبد الصمد','الحرم المكي','الحرم المدني','مؤذن آخر'];
VN.forEach((n,i)=>{$('#vo').append(new Option(n,i));$('#sl').insertAdjacentHTML('beforeend',`<label>ملف أذان ${n} <span id="ok${i}"></span></label><input type="file" accept="audio/*" data-i="${i}">`)});
$('#sl').onchange=async e=>{const f=e.target.files[0],i=e.target.dataset.i;if(f){await saveF(f,i);$('#ok'+i).textContent='✓ تم الحفظ'}};
$('#vo').onchange=e=>{S.vo=+e.target.value;sync()};
const PN=['الفجر','الظهر','العصر','المغرب','العشاء'];
PN.forEach((n,i)=>{$('#pv').insertAdjacentHTML('beforeend',`<label>${n}</label><select data-p="${i}"><option value="-1">المؤذن الافتراضي</option>${VN.map((v,j)=>`<option value="${j}">${v}</option>`).join('')}</select>`)});
$('#pv').onchange=e=>{S.pv[+e.target.dataset.p]=+e.target.value;sync()};
async function chk(){for(let i=0;i<5;i++)$('#ok'+i).textContent=(await loadF(i))?'✓ موجود':''}
$('#ts').onclick=adhan;$('#stop').onclick=stopA;
$('#gp').onclick=()=>{try{navigator.geolocation.getCurrentPosition(p=>{S.ci=-1;S.lat=+p.coords.latitude.toFixed(3);S.lon=+p.coords.longitude.toFixed(3);S.tz=Intl.DateTimeFormat().resolvedOptions().timeZone;sync()},()=>alert('تعذر تحديد الموقع، اختر مدينتك أو أدخل الإحداثيات'))}catch(e){}};
document.addEventListener('click',()=>{$('#snd').hidden=true},{once:true});
if(S.ci>=L.length)S.ci=0;
sync();setInterval(tick,1000);
</script></body></html>
